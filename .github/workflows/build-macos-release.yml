# 单独补打 macOS 包并上传到已有 GitHub Release（Windows 本机无法打 macOS）。
name: Build macOS Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.7.35)"
        required: true
        default: "v1.7.35"
        type: string
      arches:
        description: "Which macOS packages to build"
        required: true
        default: "arm64"
        type: choice
        options:
          - arm64
          - x64
          - both

permissions:
  contents: read

jobs:
  build-macos-arm64:
    if: ${{ inputs.arches == 'arm64' || inputs.arches == 'both' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      ARCH: arm64
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9A-Za-z._-]*|[0-9A-Za-z._-]*) ;;
            *) echo "Invalid tag: $RELEASE_TAG"; exit 1 ;;
          esac

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install media components
        run: |
          brew install ffmpeg
          echo "VIDEO_TOOLKIT_MEDIA_BIN=$(dirname "$(command -v ffmpeg)")" >> "$GITHUB_ENV"

      - name: Create macOS application icon
        run: |
          mkdir -p logo.iconset
          sips -z 16 16 logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32 logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32 logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64 logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128 logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256 logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256 logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512 logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512 logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o logo.icns

      - name: Embed version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "VIDEO_TOOLKIT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "$VERSION" > VERSION
          echo "Building macOS $ARCH for $RELEASE_TAG ($VERSION)"

      - name: Build macOS application
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Set application metadata and sign locally
        run: |
          APP="dist_macos/VideoToolkit.app"
          VERSION="${VIDEO_TOOLKIT_VERSION}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 视频工具合集" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 视频工具合集" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 视频工具合集" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          mv "$APP" "dist_macos/视频工具合集.app"
          codesign --force --deep --sign - "dist_macos/视频工具合集.app"
          codesign --verify --deep --strict --verbose=2 "dist_macos/视频工具合集.app"

      - name: Verify bundled FFmpeg and FFprobe
        run: |
          APP="dist_macos/视频工具合集.app"
          FFMPEG="$(find "$APP" -type f -name ffmpeg | head -1)"
          FFPROBE="$(find "$APP" -type f -name ffprobe | head -1)"
          test -n "$FFMPEG" && test -n "$FFPROBE"
          "$FFMPEG" -version
          "$FFPROBE" -version

      - name: Verify local Whisper VAD runtime
        run: |
          APP="dist_macos/视频工具合集.app"
          ONNX_RUNTIME="$(find "$APP" -iname '*onnxruntime*' | head -1)"
          test -n "$ONNX_RUNTIME"
          echo "Bundled ONNX Runtime: $ONNX_RUNTIME"

      - name: Package final artifact
        run: |
          mkdir -p dist_final
          TAG="$RELEASE_TAG"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist_macos/视频工具合集.app" \
            "dist_final/video-toolkit-macos-${ARCH}-${TAG}.zip"
          ls -lh dist_final/

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: video-toolkit-macos-arm64
          path: dist_final/*.zip
          if-no-files-found: error

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$RELEASE_TAG"
          # 与 tag 的 Build and Release 并行时，Release 可能尚未创建
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG not found yet; creating release shell..."
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG" --verify-tag || true
            for i in $(seq 1 36); do
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "Release $TAG is ready."
                break
              fi
              echo "Waiting for release $TAG ($i/36)..."
              sleep 10
            done
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG still missing after wait; upload aborted."
            exit 1
          fi
          for f in dist_final/*.zip; do
            echo "Uploading $f to release $TAG"
            gh release upload "$TAG" "$f" --clobber
          done

  build-macos-x64:
    if: ${{ inputs.arches == 'x64' || inputs.arches == 'both' }}
    runs-on: macos-15-intel
    permissions:
      contents: write
    env:
      ARCH: x64
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install media components
        run: |
