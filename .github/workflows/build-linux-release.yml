# 单独补打 Linux 包并上传到已有 GitHub Release（本机 Windows 无法打 Linux 可执行文件）。
name: Build Linux Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.7.38)"
        required: true
        default: "v1.7.39"
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate release tag
        run: |
          case "$RELEASE_TAG" in
            v[0-9A-Za-z._-]*|[0-9A-Za-z._-]*) ;;
            *) echo "Invalid tag: $RELEASE_TAG"; exit 1 ;;
          esac

      - name: Checkout tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system GUI / media libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libgl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libegl1 libdbus-1-3 libfontconfig1 libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Embed version from tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "VIDEO_TOOLKIT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VIDEO_TOOLKIT_MEDIA_BIN=$(dirname "$(command -v ffmpeg)")" >> "$GITHUB_ENV"
          echo "$VERSION" > VERSION
          echo "Building Linux x64 for $RELEASE_TAG ($VERSION)"

      - name: Build Linux application
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Package and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist_final
          (
            cd dist_linux
            zip -r -q "../dist_final/video-toolkit-linux-x64-${RELEASE_TAG}.zip" VideoToolkit
          )
          ls -lh dist_final/
          # 与 tag 的 Build and Release 并行时，Release 可能尚未创建
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG not found yet; creating draft-less release shell..."
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG" --verify-tag || true
            for i in $(seq 1 36); do
              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                echo "Release $RELEASE_TAG is ready."
                break
              fi
              echo "Waiting for release $RELEASE_TAG ($i/36)..."
              sleep 10
            done
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG still missing after wait; upload aborted."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" dist_final/*.zip --clobber
