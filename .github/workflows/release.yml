name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg and FFprobe
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          # gyan.dev 偶发 503；依次尝试多个镜像，带重试
          $urls = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/GyanD/codexffmpeg/releases/download/8.0/ffmpeg-8.0-essentials_build.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
          )
          $ok = $false
          foreach ($url in $urls) {
            for ($i = 1; $i -le 3; $i++) {
              try {
                Write-Host "Downloading FFmpeg attempt $i from $url"
                Invoke-WebRequest -Uri $url -OutFile $archive -UseBasicParsing
                if ((Get-Item -LiteralPath $archive).Length -gt 1MB) { $ok = $true; break }
              } catch {
                Write-Warning $_.Exception.Message
                Start-Sleep -Seconds (5 * $i)
              }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw 'Failed to download FFmpeg from all mirrors.' }
          if (Test-Path $extract) { Remove-Item -LiteralPath $extract -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $ffmpeg = Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'ffmpeg.exe' | Select-Object -First 1
          $ffprobe = Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'ffprobe.exe' | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw 'FFmpeg package is incomplete.' }
          "VIDEO_TOOLKIT_MEDIA_BIN=$($ffmpeg.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build portable application
        shell: pwsh
        run: .\build.ps1

      - name: Verify local Whisper VAD runtime
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -LiteralPath 'dist_folder\VideoToolkit' -Recurse -File |
            Where-Object { $_.Name -match 'onnxruntime' } | Select-Object -First 1
          if (-not $runtime) { throw 'ONNX Runtime was not bundled for local Whisper VAD.' }
          Write-Host "Bundled ONNX Runtime: $($runtime.FullName)"

      - name: Verify packaged Windows startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:VIDEO_TOOLKIT_SMOKE_TEST = '1'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'videotoolkit-smoke-profile'
          $env:VIDEO_TOOLKIT_STARTUP_TRACE = Join-Path $env:RUNNER_TEMP 'videotoolkit-startup.txt'
          $appPath = (Resolve-Path 'dist_folder\VideoToolkit\VideoToolkit.exe').Path
          $smokeProcess = Start-Process -FilePath $appPath -WindowStyle Hidden -PassThru
          if (-not $smokeProcess.WaitForExit(120000)) {
            Stop-Process -Id $smokeProcess.Id -ErrorAction SilentlyContinue
            if (Test-Path $env:VIDEO_TOOLKIT_STARTUP_TRACE) { Get-Content $env:VIDEO_TOOLKIT_STARTUP_TRACE }
            throw 'Packaged application startup timed out.'
          }
          $trace = Get-Content $env:VIDEO_TOOLKIT_STARTUP_TRACE -Raw
          Write-Host $trace
          if ($smokeProcess.ExitCode -ne 0 -or $trace -notmatch 'window shown') {
            throw "Packaged startup failed: $($smokeProcess.ExitCode)"
          }

      - name: Package final artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'dist_final' -Force | Out-Null
          $tag = "${{ github.ref_name }}"
          $version = $tag.Trim().TrimStart('v')
          if ($version -notmatch '^[0-9A-Za-z._-]+$') { throw "Invalid version from tag: $tag" }
          # Keep Inno Setup output name in sync with the git tag (avoids Setup_vX vs AppVersion mismatch).
          $iss = Get-Content -LiteralPath 'VideoToolkit.iss' -Raw
          $iss = [regex]::Replace($iss, '(?m)^AppVersion=.*$', "AppVersion=$version")
          $iss = [regex]::Replace($iss, '(?m)^OutputBaseFilename=.*$', "OutputBaseFilename=VideoToolkit_Setup_v$version")
          Set-Content -LiteralPath 'VideoToolkit.iss' -Value $iss -Encoding UTF8
          $archive = "dist_final\video-toolkit-windows-x64-$tag.zip"
          Compress-Archive -Path 'dist_folder\VideoToolkit\*' -DestinationPath $archive -CompressionLevel Optimal
          iscc VideoToolkit.iss
          $setup = "VideoToolkit_Setup_v$version.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            $found = Get-ChildItem -Filter 'VideoToolkit_Setup_*.exe' | Select-Object -First 1
            if (-not $found) { throw "Inno Setup did not produce $setup" }
            $setup = $found.Name
          }
          Move-Item -LiteralPath $setup -Destination 'dist_final\' -Force

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist_final/*.zip
            dist_final/*.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-toolkit-windows-x64
          path: dist_final/*
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install media components
        run: |
          brew install ffmpeg
          echo "VIDEO_TOOLKIT_MEDIA_BIN=$(dirname "$(command -v ffmpeg)")" >> "$GITHUB_ENV"

      - name: Create macOS application icon
        run: |
          mkdir -p logo.iconset
          sips -z 16 16 logo.png --out logo.iconset/icon_16x16.png
          sips -z 32 32 logo.png --out logo.iconset/icon_16x16@2x.png
          sips -z 32 32 logo.png --out logo.iconset/icon_32x32.png
          sips -z 64 64 logo.png --out logo.iconset/icon_32x32@2x.png
          sips -z 128 128 logo.png --out logo.iconset/icon_128x128.png
          sips -z 256 256 logo.png --out logo.iconset/icon_128x128@2x.png
          sips -z 256 256 logo.png --out logo.iconset/icon_256x256.png
          sips -z 512 512 logo.png --out logo.iconset/icon_256x256@2x.png
          sips -z 512 512 logo.png --out logo.iconset/icon_512x512.png
          sips -z 1024 1024 logo.png --out logo.iconset/icon_512x512@2x.png
          iconutil -c icns logo.iconset -o logo.icns

      - name: Build macOS application
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Set application metadata and sign locally
        run: |
          APP="dist_macos/VideoToolkit.app"
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 视频工具合集" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 视频工具合集" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 视频工具合集" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $VERSION" "$APP/Contents/Info.plist" || \
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          mv "$APP" "dist_macos/视频工具合集.app"
          codesign --force --deep --sign - "dist_macos/视频工具合集.app"
          codesign --verify --deep --strict --verbose=2 "dist_macos/视频工具合集.app"

      - name: Verify bundled FFmpeg and FFprobe
        run: |
          APP="dist_macos/视频工具合集.app"
          FFMPEG="$(find "$APP" -type f -name ffmpeg | head -1)"
          FFPROBE="$(find "$APP" -type f -name ffprobe | head -1)"
          test -n "$FFMPEG" && test -n "$FFPROBE"
          "$FFMPEG" -version
          "$FFPROBE" -version

      - name: Verify local Whisper VAD runtime
        run: |
          APP="dist_macos/视频工具合集.app"
          ONNX_RUNTIME="$(find "$APP" -iname '*onnxruntime*' | head -1)"
          test -n "$ONNX_RUNTIME"
          echo "Bundled ONNX Runtime: $ONNX_RUNTIME"

      - name: Package final artifact
        run: |
          mkdir -p dist_final
          ditto -c -k --sequesterRsrc --keepParent \
            "dist_macos/视频工具合集.app" \
            "dist_final/video-toolkit-macos-${{ matrix.arch }}-${{ github.ref_name }}.zip"

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist_final/*.zip
            dist_final/*.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-toolkit-macos-${{ matrix.arch }}
          path: dist_final/*.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system GUI / media libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Point media bin to system FFmpeg
        run: |
          echo "VIDEO_TOOLKIT_MEDIA_BIN=$(dirname "$(command -v ffmpeg)")" >> "$GITHUB_ENV"
          echo "VIDEO_TOOLKIT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build Linux application
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Verify bundled FFmpeg and FFprobe
        run: |
          APP="dist_linux/VideoToolkit"
          test -x "$APP/VideoToolkit"
          FFMPEG="$(find "$APP" -type f -name ffmpeg | head -1)"
          FFPROBE="$(find "$APP" -type f -name ffprobe | head -1)"
          test -n "$FFMPEG" && test -n "$FFPROBE"
          "$FFMPEG" -version | head -2
          "$FFPROBE" -version | head -2

      - name: Verify local Whisper VAD runtime
        run: |
          APP="dist_linux/VideoToolkit"
          ONNX_RUNTIME="$(find "$APP" -iname '*onnxruntime*' | head -1)"
          test -n "$ONNX_RUNTIME"
          echo "Bundled ONNX Runtime: $ONNX_RUNTIME"

      - name: Package final artifact
        run: |
          mkdir -p dist_final
          TAG="${{ github.ref_name }}"
          (
            cd dist_linux
            zip -r -q "../dist_final/video-toolkit-linux-x64-${TAG}.zip" VideoToolkit
          )
          ls -lh dist_final/

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist_final/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-toolkit-linux-x64
          path: dist_final/*.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # 若某一平台失败仍尽量用已成功产物发版
    if: ${{ always() && needs.build-windows.result == 'success' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          # 允许部分平台未产出
          # (download-artifact v4 无 pattern 过滤失败 job；merge 成功的即可)

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: false
